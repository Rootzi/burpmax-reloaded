name: Build jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash build.sh
          echo "VERSION=$(cat build/VERSION.txt)" >> "$GITHUB_ENV"

      - name: Keep the jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: burpmax-reloaded-${{ env.VERSION }}
          path: build/burpmax-reloaded-*.jar

      - name: Publish a release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "build/burpmax-reloaded-${VERSION}.jar" \
            --title "BurpMax Reloaded ${VERSION}" \
            --notes "Built from commit ${GITHUB_SHA}. Load in Burp: Extensions > Add > Java > select the jar." \
            --target "${GITHUB_SHA}" --latest
