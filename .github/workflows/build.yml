name: Build jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: bash build.sh

      - name: Keep the jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: burpmax-jar
          path: build/burpmax-1.0.0.jar

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp build/burpmax-1.0.0.jar "burpmax-reloaded-${SHORT}.jar"
          cp build/burpmax-1.0.0.jar burpmax-reloaded-latest.jar
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest burpmax-reloaded-latest.jar "burpmax-reloaded-${SHORT}.jar" \
            --title "Latest build (${SHORT})" \
            --notes "Built from commit ${GITHUB_SHA}. Load in Burp: Extensions > Add > Java > select the jar." \
            --target "${GITHUB_SHA}"
